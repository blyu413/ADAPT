[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adapt-locomotion"
version = "0.1.0"
description = "Analytical Disturbance-Aware Policy Training for Humanoid Locomotion"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.2.6",
  "mujoco==3.6.0",
  "scipy>=1.14,<1.16",
  "onnxruntime==1.23.2",
]

[project.optional-dependencies]
train = [
  "mjlab[cu128]==1.2.0",
  "mujoco-warp==3.6.0",
  "warp-lang==1.12.0",
  "torch==2.9.1",
  "rsl-rl-lib==5.0.1",
  "onnx>=1.17,<1.20",
  "onnxscript",
  "tensorboard",
]
robot = ["unitree-sdk2py==1.0.1", "cyclonedds==0.10.2", "pygame>=2.6,<3"]
monitor = ["matplotlib>=3.9,<3.11"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
adapt-sim = "deployment.deploy_mujoco_mjlab:main"
adapt-real = "deployment.deploy_real_lio_mjlab:main"
adapt-monitor = "scripts.momo_realtime_viewer:main"
adapt-train = "scripts.train:main"
adapt-two-stage = "scripts.train_two_stage:main"
adapt-export = "scripts.export_onnx:main"
adapt-play = "scripts.play:main"

[tool.uv]
default-groups = []
override-dependencies = ["mujoco==3.6.0"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
warp-lang = { index = "nvidia" }
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "18750c1b17ed900842c9824fd403695322c65cdc" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp.git", rev = "875c4caf06d71b12b2036c327e7a07ce08a78b9a" }
unitree-sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["observer", "common", "deployment", "scripts", "tasks"]

[tool.pytest.ini_options]
# Local checks; tests/ is ignored and not distributed.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
